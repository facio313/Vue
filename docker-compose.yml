services:
  vue:
    image: ${VUE_IMAGE:-ghcr.io/facio313/vue:latest}
    build:
      context: .
    container_name: vue
    restart: unless-stopped
    ports:
      - "127.0.0.1:5177:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
